# Configuração de teste para páginas de erro personalizadas
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 10M;
    root ./www;
    
    # Páginas de erro personalizadas
    error_page 403 /error/403.html;
    error_page 404 /error/404.html;
    error_page 500 /error/500.html;
    
    # Root location
    location / {
        alias ./www;
        index index.html;
        autoindex on;
        allow_methods GET POST;
    }
    
    # Error pages location (GET only)
    location /error {
        alias ./www/error;
        autoindex off;
        allow_methods GET;
    }
    
    # Location restrita (para testar 403)
    location /private {
        alias ./www/private;
        autoindex off;
        allow_methods GET;
    }
}

