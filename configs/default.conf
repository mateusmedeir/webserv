
server {
    
    # Maximum allowed size for client request bodies
    client_max_body_size 10M;
    # Test para o erro 413 de Payload Too Large
    # client_max_body_size 10B;


    # Server name
    server_name localhost;

    # Listen on port 8080
    listen 127.0.0.1:8080;
    
    # Default error pages
    error_page 403 /error/403.html;
    error_page 404 /error/404.html;

    root ./www;

    location / {
        cookies_enabled on;
        index index.html;
        allow_methods GET;
    }

    location /methods {
        cookies_enabled on;
        index index.html;
        allow_methods GET;
    }

    location /upload {
        cookies_enabled on;
        autoindex on;
        can_upload on;
        alias ./www/upload;
        upload_path ./www/upload;
        index index.html index.htm index.php;
        allow_methods GET POST DELETE;
    }

    location /redirect/ {
        return https://www.google.com;
    }

    location /cgi-bin/ {
        cookies_enabled on;
        allow_methods POST GET DELETE;
        cgi_extensions .py .sh .pl;
    }
}