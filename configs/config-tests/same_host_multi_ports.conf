server {
	listen 127.0.0.1:8080;

	server_name gold;

	root ./www/config-tests/gold;

	client_max_body_size 10M;

	error_page 400 /error/400.html;

	location /config-tests/gold {
		index index.html;
		allow_methods GET;
	}
}

