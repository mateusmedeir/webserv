server {
	client_max_body_size 10M;

	server_name black;

	listen 127.0.0.1:8080;

	error_page 400 /error/400.html;

	root ./;
	
	location / {
		autoindex on;
        can_upload on;
        alias ./www/config-tests/black;
        upload_path ./www/upload;
        index index.html;
        cgi_extensions .php .py;
        allow_methods GET POST DELETE;
	}
}

