# Configuração para testar múltiplos locations com cookies habilitados/desabilitados
# Útil para verificar que cookies só são enviados quando habilitados

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    
    client_max_body_size 10M;
    
    root ./www;
    
    # Location raiz - cookies habilitados
    location / {
        autoindex on;
        allow_methods GET POST;
        cookies_enabled on;
    }
    
    # Location /public - cookies desabilitados
    location /public {
        autoindex on;
        allow_methods GET;
        cookies_enabled off;
    }
    
    # Location /private - cookies habilitados
    location /private {
        autoindex off;
        allow_methods GET POST;
        cookies_enabled on;
    }
    
    # Location /api - cookies habilitados para API
    location /api {
        autoindex off;
        allow_methods GET POST DELETE;
        cookies_enabled on;
    }
    
    # Location /static - cookies desabilitados (arquivos estáticos)
    location /static {
        autoindex on;
        allow_methods GET;
        cookies_enabled off;
    }
}

