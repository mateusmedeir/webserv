# ==============================================================================
# WebServ 42 - Arquivo de Configuração Completo e Documentado
# ==============================================================================
# Este arquivo demonstra todas as funcionalidades e diretivas suportadas
# pelo servidor WebServ 42, com exemplos práticos e comentários explicativos.
#
# Formato baseado no estilo NGINX.
# ==============================================================================

# ==============================================================================
# SERVER BLOCK 1: Servidor Principal
# ==============================================================================
# Um server block define um servidor virtual que escuta em uma ou mais
# interfaces/portas e serve conteúdo baseado em configurações específicas.
# Você pode ter múltiplos server blocks para servir diferentes conteúdos
# em diferentes portas.
# ==============================================================================

server {
    # --------------------------------------------------------------------------
    # LISTEN - Define onde o servidor vai escutar conexões
    # --------------------------------------------------------------------------
    # Formato: listen [host]:[porta];
    # - host: IP ou "localhost" (padrão: 0.0.0.0 = todas as interfaces)
    # - porta: número entre 1 e 65535
    # - Você pode ter múltiplas diretivas listen no mesmo server block
    #   para escutar em várias interfaces/portas
    # Exemplos:
    #   listen 127.0.0.1:8080;     # Escuta apenas em localhost na porta 8080
    #   listen 0.0.0.0:8080;       # Escuta em todas as interfaces na porta 8080
    #   listen 8080;               # Forma simplificada (usa 0.0.0.0:8080)
    # --------------------------------------------------------------------------
    listen 0.0.0.0:8080;
    
    # --------------------------------------------------------------------------
    # SERVER_NAME - Nome do servidor (para virtual hosts)
    # --------------------------------------------------------------------------
    # Define o nome do servidor. Pode ter múltiplos nomes separados por espaço.
    # Útil para identificar diferentes sites no mesmo servidor.
    # --------------------------------------------------------------------------
    server_name localhost example.com www.example.com;
    
    # --------------------------------------------------------------------------
    # ROOT - Diretório raiz do servidor
    # --------------------------------------------------------------------------
    # Define o diretório base onde os arquivos estáticos serão servidos.
    # Este é o diretório raiz usado quando nenhum location específico corresponde.
    # --------------------------------------------------------------------------
    root ./www;
    
    # --------------------------------------------------------------------------
    # CLIENT_MAX_BODY_SIZE - Tamanho máximo do corpo da requisição
    # --------------------------------------------------------------------------
    # Define o tamanho máximo permitido para o corpo de requisições HTTP
    # (útil para uploads de arquivos).
    # Formatos aceitos: número seguido de B, K, M ou G
    # Exemplos: 1M, 10M, 100K, 2G
    # OBRIGATÓRIO: Esta diretiva deve estar presente e não pode ser zero.
    # --------------------------------------------------------------------------
    client_max_body_size 10M;
    
    # --------------------------------------------------------------------------
    # ERROR_PAGE - Páginas de erro personalizadas
    # --------------------------------------------------------------------------
    # Define páginas HTML personalizadas para códigos de erro HTTP específicos.
    # Formato: error_page [código1] [código2] ... [URI];
    # Você pode mapear múltiplos códigos para a mesma página.
    # --------------------------------------------------------------------------
    error_page 400 /error/400.html;    # Bad Request
    error_page 401 /error/401.html;    # Unauthorized
    error_page 403 /error/403.html;    # Forbidden
    error_page 404 /error/404.html;    # Not Found
    error_page 405 /error/405.html;    # Method Not Allowed
    error_page 500 /error/500.html;    # Internal Server Error
    error_page 501 /error/501.html;    # Not Implemented
    error_page 502 /error/502.html;    # Bad Gateway
    error_page 503 /error/503.html;    # Service Unavailable
    # error_page 400 401 403 /error/4xx.html;  # Múltiplos códigos para mesma página
    
    # ==========================================================================
    # LOCATION BLOCKS - Configurações específicas por rota/URL
    # ==========================================================================
    # Location blocks permitem configurar comportamentos diferentes para
    # diferentes caminhos/rotas no servidor. O servidor faz match do prefixo
    # mais longo que corresponda à URI da requisição.
    # ==========================================================================
    
    # --------------------------------------------------------------------------
    # LOCATION / - Raiz do servidor (página inicial)
    # --------------------------------------------------------------------------
    location / {
        # INDEX - Arquivos padrão a serem servidos quando a URI é um diretório
        # O servidor tentará encontrar estes arquivos na ordem especificada.
        # Se nenhum for encontrado e autoindex estiver desabilitado, retorna 404.
        index index.html index.htm index.php;
        
        # AUTOINDEX - Habilita/desabilita listagem de diretórios
        # Quando 'on', se a URI apontar para um diretório sem arquivo index,
        # o servidor gera uma página HTML listando os arquivos do diretório.
        # Valores: 'on' ou 'off' (padrão: 'off')
        autoindex on;
        
        # ALLOW_METHODS - Métodos HTTP permitidos para este location
        # Define quais métodos HTTP são aceitos. Se não especificado,
        # todos os métodos suportados (GET, POST, DELETE) são permitidos.
        # Métodos suportados: GET, POST, DELETE
        # NOTA: Use 'allow_methods' (sem 'd'), não 'allowed_methods'
        allow_methods GET POST DELETE;
        
        # COOKIES_ENABLED - Habilita/desabilita geração de cookies de sessão
        # Quando 'on', o servidor gera automaticamente cookies de sessão
        # (session_id) para rastrear clientes.
        # Valores: 'on' ou 'off' (padrão: 'off')
        cookies_enabled on;
    }
    
    # --------------------------------------------------------------------------
    # LOCATION /upload - Área de upload de arquivos
    # --------------------------------------------------------------------------
    location /upload {
        # ALIAS - Define o diretório onde os arquivos serão salvos
        # O alias substitui o prefixo do location pelo caminho especificado
        alias ./www/uploads;
        
        # CAN_UPLOAD - Habilita upload de arquivos via POST
        # Quando 'on', permite que requisições POST façam upload de arquivos.
        # Valores: 'on' ou 'off' (padrão: 'off')
        can_upload on;
        
        # UPLOAD_PATH - Caminho específico para salvar arquivos enviados
        # Define o diretório onde os arquivos enviados serão salvos.
        # Se não especificado, usa o root do location.
        upload_path ./www/uploads;
        
        # ALLOW_METHODS - Apenas POST permitido para uploads
        allow_methods POST;
        
        # CLIENT_MAX_BODY_SIZE - Pode ser sobrescrito por location
        # Limite específico para este location (maior que o padrão do servidor)
        # Nota: Esta diretiva pode não estar implementada no nível de location
        # client_max_body_size 50M;
    }
    
    # --------------------------------------------------------------------------
    # LOCATION /cgi-bin - Scripts CGI (Python, PHP, etc.)
    # --------------------------------------------------------------------------
    location /cgi-bin {
        # ALIAS - Define o diretório onde os scripts CGI estão localizados
        alias ./www/cgi-bin;
        
        # CGI_EXTENSIONS - Extensões de arquivo que devem ser executadas como CGI
        # Define quais extensões de arquivo devem ser processadas como scripts CGI.
        # Extensões suportadas: .py (Python), .php (PHP)
        # O servidor automaticamente detecta e executa scripts com estas extensões.
        cgi_extensions .py .php;
        
        # ALLOW_METHODS - Métodos permitidos para CGI
        # GET e POST são os mais comuns para scripts CGI.
        allow_methods GET POST;
        
        # COOKIES_ENABLED - Cookies podem ser úteis para sessões em CGI
        cookies_enabled on;
    }
    
    # --------------------------------------------------------------------------
    # LOCATION /api - API REST com suporte a múltiplos métodos
    # --------------------------------------------------------------------------
    location /api {
        # ALIAS - Define o diretório da API
        alias ./www/api;
        
        # INDEX - Arquivo padrão para a API
        index index.php;
        
        # CGI_EXTENSIONS - Scripts PHP para processar requisições da API
        cgi_extensions .php;
        
        # ALLOW_METHODS - Todos os métodos suportados para API REST
        allow_methods GET POST DELETE;
        
        # AUTOINDEX - Desabilitado para APIs (não queremos listar arquivos)
        autoindex off;
        
        # COOKIES_ENABLED - Cookies para autenticação de sessão
        cookies_enabled on;
    }
    
    # --------------------------------------------------------------------------
    # LOCATION /static - Arquivos estáticos (CSS, JS, imagens)
    # --------------------------------------------------------------------------
    location /static {
        # ALIAS - Substitui o prefixo do location pelo caminho especificado
        # Exemplo: URI /static/css/style.css -> caminho ./www/assets/css/style.css
        # Diferente de 'root', que adiciona o location ao caminho.
        alias ./www/assets;
        
        # ALLOW_METHODS - Apenas GET para arquivos estáticos
        allow_methods GET;
        
        # AUTOINDEX - Pode ser útil para desenvolvimento
        autoindex off;
        
        # COOKIES_ENABLED - Não necessário para arquivos estáticos
        cookies_enabled off;
    }
    
    # --------------------------------------------------------------------------
    # LOCATION /redirect - Exemplo de redirecionamento HTTP
    # --------------------------------------------------------------------------
    location /redirect {
        # RETURN - Redirecionamento HTTP
        # Quando uma requisição chega neste location, o servidor retorna
        # um código de redirecionamento (301 ou 302) com o header Location.
        # Formato: return [URL];
        # - URL começando com http:// ou https:// = redirecionamento externo
        # - URL começando com / = redirecionamento interno
        return /new-location;
        # return http://example.com;  # Redirecionamento externo
    }
    
    # --------------------------------------------------------------------------
    # LOCATION /error - Páginas de erro (apenas leitura)
    # --------------------------------------------------------------------------
    location /error {
        # ALIAS - Define o diretório das páginas de erro
        alias ./www/error;
        
        # ALLOW_METHODS - Apenas GET para visualizar páginas de erro
        allow_methods GET;
        
        # AUTOINDEX - Desabilitado para não expor estrutura de diretórios
        autoindex off;
        
        # COOKIES_ENABLED - Não necessário para páginas de erro
        cookies_enabled off;
    }
    
    # --------------------------------------------------------------------------
    # LOCATION /private - Área privada (sem listagem)
    # --------------------------------------------------------------------------
    location /private {
        # ALIAS - Define o diretório privado
        alias ./www/private;
        
        # INDEX - Arquivo padrão
        index index.html;
        
        # AUTOINDEX - Desabilitado para privacidade
        autoindex off;
        
        # ALLOW_METHODS - Apenas GET
        allow_methods GET;
        
        # COOKIES_ENABLED - Pode ser útil para autenticação
        cookies_enabled on;
    }
}

# ==============================================================================
# SERVER BLOCK 2: Servidor Secundário (Porta Diferente)
# ==============================================================================
# Você pode ter múltiplos server blocks para servir diferentes conteúdos
# em diferentes portas. Útil para desenvolvimento, testes ou diferentes
# aplicações no mesmo servidor.
# ==============================================================================

server {
    # Escuta em outra porta
    listen 8081;
    server_name localhost;
    
    # Configuração diferente para este servidor
    root ./www/test;
    client_max_body_size 5M;
    
    # Location simples para testes
    location / {
        index test.html;
        autoindex off;
        allow_methods GET;
        cookies_enabled off;
    }
    
    # Location para API de testes
    location /api {
        alias ./www/api;
        cgi_extensions .py .php;
        allow_methods GET POST DELETE;
        cookies_enabled on;
    }
}

# ==============================================================================
# NOTAS IMPORTANTES:
# ==============================================================================
#
# 1. SINTAXE:
#    - Todas as diretivas devem terminar com ponto e vírgula (;)
#    - Location blocks devem estar entre chaves { }
#    - Comentários começam com # e vão até o final da linha
#
# 2. PRIORIDADE DE LOCATIONS:
#    - O servidor faz match do location com o prefixo mais longo
#    - Exemplo: /api/users corresponde melhor a /api/users que a /api
#
# 3. VALORES PADRÃO:
#    - autoindex: off
#    - can_upload: off
#    - cookies_enabled: off
#    - Se allow_methods não for especificado, todos os métodos são permitidos
#
# 4. LIMITAÇÕES:
#    - Métodos HTTP suportados: GET, POST, DELETE
#    - Extensões CGI suportadas: .py (Python), .php (PHP)
#    - client_max_body_size é OBRIGATÓRIO e não pode ser zero
#    - Location blocks NÃO suportam diretiva 'root', use 'alias' em vez disso
#
# 5. ROOT vs ALIAS (IMPORTANTE):
#    - 'root' (server block): Define o diretório base do servidor
#    - 'alias' (location block): Substitui o prefixo do location pelo caminho
#    Exemplo:
#      location /static {
#          alias ./www/assets;
#      }
#      URI /static/css/style.css -> caminho ./www/assets/css/style.css
#      
#      Se usasse 'root ./www/assets':
#      URI /static/css/style.css -> caminho ./www/assets/static/css/style.css (ERRADO!)
#
# 6. CAMINHOS:
#    - Use caminhos relativos (./www) ou absolutos (/var/www)
#    - Certifique-se de que os diretórios existem e têm permissões corretas
#
# 7. NOMENCLATURA:
#    - Use 'allow_methods' (sem 'd'), não 'allowed_methods'
#    - Alguns exemplos antigos podem usar 'allowed_methods', mas o código
#      atual espera 'allow_methods'
#
# ==============================================================================

