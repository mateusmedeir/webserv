# Configuração para testar cookies com CGI
# Cookies habilitados em locations que executam scripts CGI

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    
    client_max_body_size 10M;
    
    root ./www;
    
    # Location raiz - cookies habilitados
    location / {
        autoindex on;
        allow_methods GET POST;
        cookies_enabled on;
    }
    
    # Location CGI - cookies habilitados para scripts
    location /cgi-bin {
        autoindex off;
        allow_methods GET POST;
        cgi_extensions .php .py;
        cookies_enabled on;
    }
    
    # Location para uploads - cookies habilitados
    location /upload {
        can_upload on;
        allow_methods POST;
        upload_path ./uploads;
        cookies_enabled on;
    }
}

