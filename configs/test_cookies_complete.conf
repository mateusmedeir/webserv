# Configuração completa para testar todos os aspectos de cookies
# Inclui diferentes cenários: raiz, subdiretórios, CGI, uploads

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    
    client_max_body_size 10M;
    
    error_page 404 /error/404.html;
    error_page 500 /error/500.html;
    
    root ./www;
    
    # Location raiz - cookies habilitados
    # Primeira requisição deve gerar cookie de sessão
    location / {
        autoindex on;
        allow_methods GET POST DELETE;
        cookies_enabled on;
        index index.html index.htm;
    }
    
    # Location /session - cookies habilitados para gerenciamento de sessão
    location /session {
        autoindex off;
        allow_methods GET POST;
        cookies_enabled on;
    }
    
    # Location /public - cookies desabilitados
    # Cookies não devem ser enviados para este location
    location /public {
        autoindex on;
        allow_methods GET;
        cookies_enabled off;
    }
    
    # Location CGI - cookies habilitados
    # Scripts CGI podem acessar cookies via HTTP_COOKIE
    location /cgi-bin {
        autoindex off;
        allow_methods GET POST;
        cgi_extensions .py;
        cookies_enabled on;
    }
    
    # Location uploads - cookies habilitados
    location /upload {
        can_upload on;
        allow_methods POST;
        upload_path ./uploads;
        cookies_enabled on;
    }
    
    # Location /api - cookies habilitados para API
    location /api {
        autoindex off;
        allow_methods GET POST DELETE;
        cookies_enabled on;
    }
    
    # Location /assets - cookies desabilitados (arquivos estáticos)
    location /assets {
        autoindex on;
        allow_methods GET;
        cookies_enabled off;
    }
    
    # Location /error - cookies desabilitados
    location /error {
        autoindex off;
        allow_methods GET;
        cookies_enabled off;
    }
}

